# nfpm config for the RHI Linux .deb and .rpm (packaging/build-packages.sh runs nfpm with it).
# RHI_VERSION and RHI_PKG_ROOT come from the script; RHI_PKG_ROOT is the staged tree:
#   opt/rhi-linux/                self-contained linux-x64 publish (no .pdb)
#   usr/bin/rhi-linux             packaging/rhi-linux-launcher.sh
#   usr/share/applications/rhi-linux.desktop, usr/share/icons/hicolor/96x96/apps/rhi-linux.png
#
# Dependencies are what the bundled build loads from the system, checked against the publish
# (readelf NEEDED of RHI and every bundled .so, plus the libraries the .NET runtime and Avalonia's
# X11 backend dlopen):
#   libc/libstdc++/libgcc_s, zlib (System.IO.Compression.Native), fontconfig (libSkiaSharp; freetype
#   comes with it), ICU (System.Globalization.Native, probed by version), OpenSSL 3 or 1.1
#   (System.Security.Cryptography.Native.OpenSsl), and Avalonia 12 X11's libX11, libXext,
#   libXrandr, libXi, libXcursor, libXfixes, libICE, libSM.
# Optional, so only recommended: libGL (GLX; Avalonia falls back to software rendering), GTK 3 (the
# file chooser when no desktop portal answers; Avalonia has its own fallback) and a 7-Zip tool
# (some components ship .7z archives). liblttng-ust is NOT needed: only the .NET tracing provider
# (libcoreclrtraceptprovider.so) links it, and the runtime skips that provider when it is missing.
name: rhi-linux
arch: amd64
platform: linux
version: ${RHI_VERSION}
version_schema: none
release: "1"
section: games
priority: optional
maintainer: RHI Linux Nonspaced <https://github.com/nonspacial/RHI-Linux-Nonspaced/issues>
vendor: RHI Linux Nonspaced
homepage: https://github.com/nonspacial/RHI-Linux-Nonspaced
license: GPL-3.0
description: |-
  Mod manager for graphics components in Windows games run through Wine and Proton
  RHI Linux installs, updates and removes ReShade, OptiScaler, RenoDX, Luma and other
  graphics components in games from Steam, Heroic, Lutris, Wine prefixes and Xbox / Game Pass.
  This is a self-contained build: it bundles the .NET runtime it needs.

contents:
  - src: ${RHI_PKG_ROOT}/opt/rhi-linux/
    dst: /opt/rhi-linux
    type: tree
    expand: true
  - src: ${RHI_PKG_ROOT}/usr/bin/rhi-linux
    dst: /usr/bin/rhi-linux
    expand: true
    file_info:
      mode: 0755
  - src: ${RHI_PKG_ROOT}/usr/share/applications/rhi-linux.desktop
    dst: /usr/share/applications/rhi-linux.desktop
    expand: true
    file_info:
      mode: 0644
  - src: ${RHI_PKG_ROOT}/usr/share/icons/hicolor/96x96/apps/rhi-linux.png
    dst: /usr/share/icons/hicolor/96x96/apps/rhi-linux.png
    expand: true
    file_info:
      mode: 0644

overrides:
  deb:
    depends:
      - libc6
      - libgcc-s1
      - libstdc++6
      - zlib1g
      - libfontconfig1
      - libfreetype6
      - libicu80 | libicu79 | libicu78 | libicu77 | libicu76 | libicu75 | libicu74 | libicu73 | libicu72 | libicu71 | libicu70 | libicu69 | libicu68 | libicu67 | libicu66
      - libssl3t64 | libssl3 | libssl1.1
      - libx11-6
      - libxext6
      - libxrandr2
      - libxi6
      - libxcursor1
      - libxfixes3
      - libice6
      - libsm6
    recommends:
      - libgl1
      - libgtk-3-0t64 | libgtk-3-0
      - 7zip | p7zip-full
  rpm:
    # Shared-library names, not package names: Fedora and openSUSE name the packages differently
    # (libX11 vs libX11-6, openssl-libs vs libopenssl3), but both resolve these the same way.
    depends:
      - libc.so.6()(64bit)
      - libgcc_s.so.1()(64bit)
      - libstdc++.so.6()(64bit)
      - libz.so.1()(64bit)
      - libfontconfig.so.1()(64bit)
      - libfreetype.so.6()(64bit)
      - (libicuuc.so.80()(64bit) or libicuuc.so.79()(64bit) or libicuuc.so.78()(64bit) or libicuuc.so.77()(64bit) or libicuuc.so.76()(64bit) or libicuuc.so.75()(64bit) or libicuuc.so.74()(64bit) or libicuuc.so.73()(64bit) or libicuuc.so.72()(64bit) or libicuuc.so.71()(64bit) or libicuuc.so.70()(64bit) or libicuuc.so.69()(64bit) or libicuuc.so.68()(64bit) or libicuuc.so.67()(64bit) or libicuuc.so.66()(64bit))
      - (libssl.so.3()(64bit) or libssl.so.1.1()(64bit))
      - libX11.so.6()(64bit)
      - libXext.so.6()(64bit)
      - libXrandr.so.2()(64bit)
      - libXi.so.6()(64bit)
      - libXcursor.so.1()(64bit)
      - libXfixes.so.3()(64bit)
      - libICE.so.6()(64bit)
      - libSM.so.6()(64bit)
    recommends:
      - libGL.so.1()(64bit)
      - libgtk-3.so.0()(64bit)
      - (7zip or p7zip)

rpm:
  summary: Mod manager for graphics components in Windows games run through Wine and Proton
  group: Amusements/Games
  packager: RHI Linux Nonspaced <https://github.com/nonspacial/RHI-Linux-Nonspaced/issues>
  buildhost: rhi-linux-build
  compression: zstd

deb:
  compression: xz
